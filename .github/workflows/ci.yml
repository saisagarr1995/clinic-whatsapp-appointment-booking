name: ci

on:
  push:
    branches: [main, "release/**", "feature/**"]
  pull_request:
    branches: [main, "release/**"]

# Forked PRs get no secrets and no write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, test, security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests
        continue-on-error: true

      - name: Tests
        run: pytest -q --cov=clinic_bot --cov-report=term-missing

      - name: Security scan (bandit)
        run: bandit -r src -ll

      - name: Dependency CVE audit
        run: pip-audit --skip-editable

      - name: Verify no secrets are committed
        run: |
          set -e
          # These must never reach the repository.
          for f in .env RECREATE_PROMPT.md; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is tracked by git and must not be."
              exit 1
            fi
          done
          if git ls-files | grep -E '\.(db|sqlite3?)$'; then
            echo "::error::A database file is tracked by git."
            exit 1
          fi
          echo "No secrets tracked."

      - name: Validate every clinic in the fleet registry
        run: python scripts/clinic_admin.py check

