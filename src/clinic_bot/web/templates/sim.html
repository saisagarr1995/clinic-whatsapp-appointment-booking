<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Simulator · {{ clinic_name }}</title>
<style>
  :root {
    --bg: #0b141a; --panel: #111b21; --in: #202c33; --out: #005c4b;
    --ink: #e9edef; --muted: #8696a0; --line: #2a3942; --accent: #00a884;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex: none;
  }
  header .name { font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  button.reset {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  button.reset:hover { color: var(--ink); }

  .banner {
    background: #4a3a12; color: #ffd77a; font-size: 12.5px;
    padding: 7px 16px; text-align: center; flex: none;
  }

  #chat { flex: 1; overflow-y: auto; padding: 18px 14px; }
  .wrap { max-width: 620px; margin: 0 auto; }

  .msg {
    background: var(--in); border-radius: 10px; padding: 9px 12px;
    margin-bottom: 8px; max-width: 85%; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.me { background: var(--out); margin-left: auto; }
  .hdr { font-weight: 600; margin-bottom: 4px; }
  .ftr { color: var(--muted); font-size: 12px; margin-top: 5px; }

  .btns { display: flex; flex-direction: column; gap: 6px; margin-top: 9px; }
  .btn {
    background: transparent; border: 1px solid var(--accent); color: var(--accent);
    border-radius: 8px; padding: 9px; font-size: 14px; cursor: pointer; width: 100%;
    font-family: inherit;
  }
  .btn:hover:not(:disabled) { background: rgba(0,168,132,.12); }
  .btn:disabled { opacity: .45; cursor: default; border-color: var(--line); color: var(--muted); }

  .rows { margin-top: 9px; border-top: 1px solid var(--line); }
  .sec { color: var(--muted); font-size: 12px; text-transform: uppercase;
         letter-spacing: .05em; padding: 9px 0 3px; }
  .row {
    display: block; width: 100%; text-align: left; background: transparent;
    border: none; border-bottom: 1px solid var(--line); color: var(--ink);
    padding: 10px 2px; cursor: pointer; font-size: 14px; font-family: inherit;
  }
  .row:hover:not(:disabled) { background: rgba(255,255,255,.04); }
  .row:disabled { opacity: .45; cursor: default; }
  .row .t { font-weight: 500; }
  .row .d { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

  .sys { text-align: center; color: var(--muted); font-size: 12px; margin: 14px 0; }
  .err { color: #f6a5a5; }

  footer {
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 12px 14px; flex: none;
  }
  form { max-width: 620px; margin: 0 auto; display: flex; gap: 9px; }
  input {
    flex: 1; background: var(--in); border: 1px solid var(--line); color: var(--ink);
    border-radius: 20px; padding: 11px 16px; font-size: 15px; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .send {
    background: var(--accent); color: #06231c; border: none; border-radius: 50%;
    width: 42px; height: 42px; font-size: 18px; cursor: pointer; flex: none;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="name">{{ clinic_name }}</div>
    <div class="sub">simulator · /c/{{ slug }} · patient {{ wa_id }}</div>
  </div>
  <div class="spacer"></div>
  <button class="reset" id="resetBtn" type="button">Reset chat</button>
</header>

<div class="banner">
  Offline simulator — real state machine, real database, no WhatsApp. Bookings made here are real.
</div>

<div id="chat"><div class="wrap" id="feed">
  <div class="sys">Send any message to begin, e.g. <strong>hi</strong></div>
</div></div>

<footer>
  <form id="form" autocomplete="off">
    <input id="input" placeholder="Type a message" autofocus>
    <button class="send" type="submit" aria-label="Send">➤</button>
  </form>
</footer>

<script>
(function () {
  var SLUG = {{ slug|tojson }};
  var WA_ID = {{ wa_id|tojson }};
  var feed = document.getElementById('feed');
  var chat = document.getElementById('chat');
  var form = document.getElementById('form');
  var input = document.getElementById('input');

  function scroll() { chat.scrollTop = chat.scrollHeight; }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function disableOld() {
    // A patient can tap an old button in WhatsApp, but showing every past
    // keyboard as live makes the simulator confusing. Grey out superseded ones.
    var stale = feed.querySelectorAll('button.btn:not(:disabled), button.row:not(:disabled)');
    for (var i = 0; i < stale.length; i++) stale[i].disabled = true;
  }

  function addMine(text) {
    disableOld();
    feed.appendChild(el('div', 'msg me', text));
    scroll();
  }

  function addSystem(text, isError) {
    feed.appendChild(el('div', 'sys' + (isError ? ' err' : ''), text));
    scroll();
  }

  function render(m) {
    var box = el('div', 'msg');

    if (m.header) box.appendChild(el('div', 'hdr', m.header));
    box.appendChild(el('div', '', m.body || ''));
    if (m.footer) box.appendChild(el('div', 'ftr', m.footer));

    if (m.kind === 'buttons') {
      var bwrap = el('div', 'btns');
      m.buttons.forEach(function (b) {
        var btn = el('button', 'btn', b.title);
        btn.type = 'button';
        btn.addEventListener('click', function () { send({ reply_id: b.id }, b.title); });
        bwrap.appendChild(btn);
      });
      box.appendChild(bwrap);
    }

    if (m.kind === 'list') {
      var rwrap = el('div', 'rows');
      m.sections.forEach(function (s) {
        if (s.title) rwrap.appendChild(el('div', 'sec', s.title));
        s.rows.forEach(function (r) {
          var row = el('button', 'row');
          row.type = 'button';
          row.appendChild(el('div', 't', r.title));
          if (r.description) row.appendChild(el('div', 'd', r.description));
          row.addEventListener('click', function () { send({ reply_id: r.id }, r.title); });
          rwrap.appendChild(row);
        });
      });
      box.appendChild(rwrap);
    }

    feed.appendChild(box);
    scroll();
  }

  function send(payload, echo) {
    addMine(echo);
    var body = { wa_id: WA_ID, text: payload.text || '', reply_id: payload.reply_id || null };
    fetch('/c/' + SLUG + '/sim/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data.messages.length) addSystem('(the bot sent nothing)');
        data.messages.forEach(render);
      })
      .catch(function (e) { addSystem('Error: ' + e.message + ' — check the server log', true); });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    send({ text: text }, text);
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    fetch('/c/' + SLUG + '/sim/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ wa_id: WA_ID })
    }).then(function () {
      feed.innerHTML = '';
      addSystem('Conversation reset. Existing bookings were kept.');
    });
  });
})();
</script>
</body>
</html>
